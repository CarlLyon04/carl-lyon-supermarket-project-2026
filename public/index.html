<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carl Lyon's Supermarket Price Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>Carl Lyon's Supermarket Price Tracker</h1>
        <p>Track and compare prices of your favorite supermarket items.</p>
        <form id="submissionForm">
            <!-- Supermarket Name Input -->
            <label for="market_name">Supermarket Name: </label>
            <input type="text" id="market_name" name="market_name" placeholder="Enter supermarket name" maxlenght="100"
                required>

            <!-- Products and Prices Input -->
            <div id="products">
                <div class="product-row">
                    <input type="text" name="product_name[]" placeholder="Enter product name" maxlength="100"
                        aria-label="Product Name" required>
                    <input type="number" name="product_price[]" placeholder="Enter product price" min="0" max="9999"
                        step="0.01" aria-label="Product Price" required>
                </div>
            </div>

            <button type="button" id="addProductButton">Add Product</button>


            <!-- Product Image Section -->
            <h2>Product Image</h2>
            <label type="file" for="product_image">Upload Product Image: </label>
            <input type="file" id="image" name="product_image" accept="image/jpeg,image/png,image/webp"
                aria-label="Product Image">
            <label for="image_type">Image Type</label>
            <select id="image_type" name="image_type">
                <option value="Shelf">Shelf</option>
                <option value="Product">Product</option>
                <option value="Receipt">Receipt</option>
            </select>

            <!-- Submit Button Section -->
            <button type="submit">Add</button>
        </form>
    </main>
</body>

</html>
