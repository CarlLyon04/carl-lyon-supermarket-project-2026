<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carl Lyon's Supermarket Price Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>Carl Lyon's Supermarket Price Tracker</h1>
        <p>Record supermarket products and prices.</p>

        <form id="submissionForm">

            <!-- Supermarket Name -->
            <label for="market_name">Supermarket Name</label>
            <input type="text" id="market_name" name="market_name" placeholder="Enter supermarket name" maxlength="150"
                required>

            <!-- Products and Prices -->
            <h2>Products & Prices</h2>

            <div id="products">
                <div class="product-row">

                    <div class="field">
                        <label>
                            Product
                            <input type="text" name="product_name[]" placeholder="e.g. Milk 1L" maxlength="150"
                                required>
                        </label>
                    </div>

                    <div class="field">
                        <label>
                            Price (€)
                            <input type="number" name="product_price[]" placeholder="0.00" min="0" max="9999"
                                step="0.01" required>
                        </label>
                    </div>

                </div>
            </div>

            <button type="button" id="addProductButton">
                + Add Product
            </button>

            <!-- Image Upload -->
            <h2>Product Image</h2>

            <div class="upload-box">
                <div class="upload-icon" aria-hidden="true">↑</div>

                <label for="image">Choose or capture an image</label>
                <small>JPEG, PNG or WebP · Max 5 MB</small>

                <input type="file" id="image" name="product_image" accept="image/jpeg,image/png,image/webp">

                <button type="button" id="removeImageButton">Remove Image</button>
            </div>

            <label for="image_type">Image Type</label>
            <select id="image_type" name="image_type">
                <option value="shelf">Shelf</option>
                <option value="product">Product</option>
                <option value="receipt">Receipt</option>
            </select>

            <!-- Submit -->
            <button type="submit">Submit Prices</button>

        </form>
    </main>
</body>

</html>
